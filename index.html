<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>QR Transfer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="description" content="Private peer-to-peer file transfer using QR codes. Files stay on your devices.">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff;--fg:#111;--mut:#666;--card:#f1f1f4;--ac:#2563eb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--fg:#eee;--mut:#999;--card:#1d1d21;--ac:#60a5fa}}
:root[data-theme="dark"]{--bg:#111;--fg:#eee;--mut:#999;--card:#1d1d21;--ac:#60a5fa}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0 auto;max-width:480px;padding:16px;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif}
h1{font-size:20px;margin:0 0 12px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
button,.btn{background:var(--card);color:var(--fg);border:0;border-radius:10px;padding:12px 14px;font:inherit;cursor:pointer}
.tabs button{flex:1}.on{background:var(--ac)!important;color:#fff!important}
.card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:12px}
input[type=file],input[type=number]{width:100%;margin:6px 0;font:inherit;color:var(--fg)}
canvas,video{width:100%;border-radius:8px;background:#fff;image-rendering:pixelated;display:block}
.m{color:var(--mut);font-size:14px;margin:6px 0 0}
.go{background:var(--ac);color:#fff;width:100%;margin-top:6px}
.hide{display:none}
</style></head><body>
<h1>QR Transfer</h1>
<div class="tabs"><button id="t1" class="on">Send</button><button id="t2">Receive</button></div>

<div id="send">
  <div class="card">
    <input type="file" id="file">
    <label class="m">Frames per second <input type="number" id="fps" value="8" min="1" max="20"></label>
    <button class="go" id="go">Start sending</button>
    <p class="m" id="info">Best for small files (up to ~500 KB). Keep the screen bright and steady.</p>
  </div>
  <canvas id="qr" class="hide"></canvas>
  <p class="m" id="st"></p>
</div>

<div id="recv" class="hide">
  <div class="card">
    <button class="go" id="rx">Start camera</button>
    <p class="m" id="rs">Point the camera at the sender's QR code.</p>
  </div>
  <video id="vid" playsinline muted class="hide"></video>
  <button class="go hide" id="dl">Save file</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
const $=id=>document.getElementById(id), CS=400;
const crc32=b=>{let c=-1;for(let i=0;i<b.length;i++){c^=b[i];for(let k=0;k<8;k++)c=c&1?(c>>>1)^0xEDB88320:c>>>1}return((c^-1)>>>0).toString(16).padStart(8,'0')};
const enc=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
const dec=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
// Fountain code: first K frames are plain chunks, later frames are XORs of random chunk sets (same function on both sides)
function idxs(s,K){if(s<K)return[s];const r=rng(s),u=r();let d=u<.25?1:u<.6?2:u<.8?3:u<.9?4:u<.95?6:10;d=Math.min(d,K);const set=new Set();while(set.size<d)set.add(Math.floor(r()*K));return[...set]}
const xor=(a,b)=>{for(let j=0;j<a.length;j++)a[j]^=b[j]};

function tab(n){$('send').classList.toggle('hide',n!==1);$('recv').classList.toggle('hide',n!==2);$('t1').classList.toggle('on',n===1);$('t2').classList.toggle('on',n===2)}
$('t1').onclick=()=>tab(1);$('t2').onclick=()=>tab(2);

// ---------- Sender ----------
let timer;
function draw(t){const q=qrcode(0,'L');q.addData(t,'Byte');q.make();const m=q.getModuleCount(),c=$('qr'),S=6,P=4,w=(m+P*2)*S;c.width=c.height=w;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,w);x.fillStyle='#000';for(let r=0;r<m;r++)for(let k=0;k<m;k++)if(q.isDark(r,k))x.fillRect((k+P)*S,(r+P)*S,S,S)}
$('go').onclick=async()=>{
  const f=$('file').files[0];if(!f){$('info').textContent='Pick a file first.';return}
  clearInterval(timer);
  const z=pako.deflate(new Uint8Array(await f.arrayBuffer())),n=z.length,K=Math.ceil(n/CS),id=crc32(z);
  const nm=btoa(unescape(encodeURIComponent(f.name.slice(0,60)))),fps=Math.max(1,Math.min(20,+$('fps').value||8));
  if(!n){return}
  $('qr').classList.remove('hide');let s=0;
  $('info').textContent=`${K} chunks · about ${Math.ceil(K*1.4/fps)}s per pass at ${fps} fps. Loops until you stop.`;
  const show=()=>{const p=new Uint8Array(CS);idxs(s,K).forEach(i=>xor(p,z.subarray(i*CS,i*CS+CS)));
    draw([id,n,CS,s,nm,enc(p)].join('.'));$('st').textContent=`Frame ${s} · ${(n/1024).toFixed(1)} KB compressed`;s++};
  show();timer=setInterval(show,1000/fps);
};

// ---------- Receiver ----------
let st=null,known=[],pend=[],cnt=0,seen=new Set(),scanning=false,stream=null,result=null;
function add(idx,data){
  const q=[[idx,data]];
  while(q.length){
    let [ix,d]=q.pop();
    ix=ix.filter(i=>{if(known[i]){xor(d,known[i]);return false}return true});
    if(!ix.length)continue;
    if(ix.length>1){pend.push([ix,d]);continue}
    known[ix[0]]=d;cnt++;
    const p=pend;pend=[];p.forEach(e=>q.push(e));
  }
}
function take(t){
  const p=t.split('.');if(p.length!==6)return;
  const [id,n,cs,s,nm,pl]=p;
  if(!st||st.id!==id){let name='file';try{name=decodeURIComponent(escape(atob(nm)))}catch(e){}
    st={id,n:+n,cs:+cs,K:Math.ceil(+n/+cs),name};known=[];pend=[];cnt=0;seen=new Set()}
  if(seen.has(s))return;seen.add(s);
  add(idxs(+s,st.K),dec(pl));
  $('rs').textContent=`${cnt}/${st.K} chunks · ${seen.size} frames seen`;
  if(cnt===st.K)finish();
}
function finish(){
  scanning=false;stream&&stream.getTracks().forEach(t=>t.stop());$('vid').classList.add('hide');
  const z=new Uint8Array(st.n);
  for(let i=0;i<st.K;i++)z.set(known[i].subarray(0,Math.min(st.cs,st.n-i*st.cs)),i*st.cs);
  if(crc32(z)!==st.id){$('rs').textContent='Checksum failed. Start the camera and try again.';return}
  result={name:st.name,data:pako.inflate(z)};
  $('rs').textContent=`Received ${st.name} (${result.data.length} bytes), checksum OK.`;
  $('dl').classList.remove('hide');
}
$('rx').onclick=async()=>{
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280}}})}
  catch(e){$('rs').textContent='Camera unavailable: '+(e.message||e.name)+'. Open QR Transfer directly in your browser and allow camera access.';return}
  const v=$('vid');v.srcObject=stream;await v.play();v.classList.remove('hide');
  st=null;$('dl').classList.add('hide');scanning=true;$('rs').textContent='Scanning...';
  const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
  const loop=()=>{if(!scanning)return;
    if(v.videoWidth){cv.width=v.videoWidth;cv.height=v.videoHeight;cx.drawImage(v,0,0);
      const im=cx.getImageData(0,0,cv.width,cv.height),r=jsQR(im.data,im.width,im.height,{inversionAttempts:'dontInvert'});
      if(r)take(r.data)}
    requestAnimationFrame(loop)};
  loop();
};
$('dl').onclick=()=>{
  if(!result)return;
  try{
    const blob=new Blob([result.data],{type:'application/octet-stream'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=result.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }catch(e){
    $('rs').textContent='Save did not complete: '+(e.message||'error');
  }
};
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script></body></html>
